# Автоматическая сборка TaskMatrix.exe на Windows-сервере GitHub.
# Запускается при каждом изменении приложения (папка task_matrix)
# и вручную со вкладки Actions. Готовый .exe публикуется в разделе Releases.
name: Сборка Windows .exe

on:
  push:
    paths:
      - "task_matrix/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы опубликовать релиз с .exe

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: task_matrix
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt

      - name: Проверка, что приложение импортируется
        run: python -c "import app.ui.main_window"

      - name: Сборка .exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name TaskMatrix main.py

      - name: Сохранить .exe как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: TaskMatrix
          path: task_matrix/dist/TaskMatrix.exe

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: life-rpg-latest
          name: Life RPG — последняя сборка
          body: |
            Скачайте **TaskMatrix.exe** ниже и запустите двойным кликом.
            Python устанавливать не нужно.
            Если Windows покажет «Система Windows защитила ваш компьютер» — нажмите «Подробнее» → «Выполнить в любом случае».
          files: task_matrix/dist/TaskMatrix.exe
          make_latest: true
